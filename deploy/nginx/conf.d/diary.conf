# Single entry point of the application. TLS is not terminated here: the public HTTPS
# endpoint is handled outside this stack. Port 80 is only published on 127.0.0.1.
server {
    listen 80;
    server_name _;
    client_max_body_size 1m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Sign-in endpoints: 10 requests per minute per client, with a short burst allowance.
    location /api/auth/ {
        limit_req zone=auth burst=5 nodelay;
        proxy_pass http://app:3000;
        include /etc/nginx/proxy_params.conf;
    }

    location / {
        proxy_pass http://app:3000;
        include /etc/nginx/proxy_params.conf;
    }
}
